name: MkDocs自动部署到GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装所有依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 自动构建+部署
        run: mkdocs gh-deploy --force