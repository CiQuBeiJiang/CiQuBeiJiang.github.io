name: 自动部署 MkDocs 文档到 GitHub Pages
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: 升级pip + 安装依赖 + 手动安装所有插件 (双重保险，永不缺失)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install mkdocs-awesome-pages-plugin mkdocs-minify-plugin mkdocs-statistics-plugin mkdocs-img2fig-plugin mkdocs-glightbox mkdocs-git-revision-date-localized-plugin

      - name: 构建并部署
        run: mkdocs gh-deploy --force --verbose