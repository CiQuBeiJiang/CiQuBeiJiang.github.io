name: 自动部署 MkDocs 文档到 GitHub Pages
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python3.12稳定环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 强制安装所有依赖+插件
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --force-reinstall --no-cache-dir mkdocs==1.6.1 mkdocs-material==9.5.21 mkdocs-material-extensions==1.3.1
          pip install --force-reinstall --no-cache-dir mkdocs-awesome-pages-plugin==2.10.1 mkdocs-glightbox==0.5.2 mkdocs-img2fig-plugin mkdocs-minify-plugin==0.6.2
          pip install --force-reinstall --no-cache-dir mkdocs-git-revision-date-localized-plugin==1.2.0 ghp-import==2.1.0 pymdown-extensions==10.6

      - name: 部署到GitHub Pages（带令牌授权）
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: mkdocs gh-deploy --force --remote-branch gh-pages