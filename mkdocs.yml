site_name: 此去北疆
site_description: 我的技术笔记
theme:
  name: material
  icon:
    logo: material/snowflake-outline 
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
nav:
  - 首页: index.md
  - 关于我: about.md
  - 学习笔记: notes.md
  - 我的思考: diary.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ciqubeijiang
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/XXXXXX
    - icon: fontawesome/solid/paper-plane
      link: 1724961030@qq.com
