site_name: 此去北疆
site_description: 我的技术笔记
theme:
  name: material
  icon:
    icon: material/snowflake
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
nav:
  - 首页: about.md
  - 文学: literature
  - 哲学: philosophy
  - 我的随笔: diary
  - 机器学习: machine_learning
  - 运筹优化: optimization
  - 数据分析: data_analysis
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ciqubeijiang
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/XXXXXX
    - icon: fontawesome/solid/paper-plane
      link: 1724961030@qq.com
copyright: Copyright &copy; 2026 ciqubeijiang. All rights reserved.
extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences