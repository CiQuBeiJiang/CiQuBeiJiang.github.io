site_name: 此去北疆
site_description: 江屿的技术笔记
site_url: https://CiQuBeiJiang.github.io
site_dir: site
repo_url: https://github.com/CiQuBeiJiang/CiQuBeiJiang.github.io
theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/snowflake 
  favicon: assets/camera.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    # navigation.sections不能加，会冲突


extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css


extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/site-links.js

nav:
  - 个人简介: about/index.md
  - 网站信息: site_info/index.md
  - 阅读:
    - reading/index.md
    - 文学:
      - literary/index.md
    - 哲学:
      - philosophy/index.md
    - 阅读笔记:
      - reading_notes/index.md
      - 《娱乐至死》读书总结: literary/amusing_ourselves_to_death.md
    - 收藏的诗歌: literary/poetry.md
  - 随笔:
    - diary/index.md
    - 花: diary/flower.md
    - 伞: diary/伞.md
    - 第一百次告别: diary/第一百次告别.md
  - 研究:
    - research/index.md
    - 机器学习:
      - 首页: machine_learning/index.md
      - KNN 算法: machine_learning/KNN.md
      - NumPy 笔记: machine_learning/numpy_tutorial.md
    - 数据分析:
      - 首页: data_analysis/index.md
      - 一般流程: data_analysis/general_process.md
      - Matplotlib 基础: data_analysis/matplotlib-fundamental.md
    - 运筹优化:
      - 首页: optimization/index.md
      - COPT 笔记: optimization/copt_usage.md
      - KDTree + DFJ 求解 TSP: optimization/TSP_KDTree_DFJ.md
      - MIP 服务器部署: optimization/mip_server_deployment.md
      - XGBoost 与 MIP 联合优化: optimization/telecom_network_maintenance.md
    - 技术札记:
      - 首页: tech_notes/index.md
      - Git 笔记: tech_notes/git_commands.md
      - Markdown 笔记: tech_notes/markdown_syntax.md
      - LaTeX 笔记: tech_notes/latex_syntax.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      use_pygments: false
      anchor_linenums: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:  
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ciqubeijiang
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/XXXXXX
    - icon: fontawesome/solid/paper-plane
      link: mailto:1724961030@qq.com 

copyright: Copyright &copy; 2026 ciqubeijiang. All rights reserved.

plugins:
  - search
  - glightbox
  - statistics
  - minify: 
      minify_html: true
      minify_css: true
      minify_js: true
  - git-revision-date-localized:  
      type: date                  
      locale: zh_CN     
  - img2fig  
